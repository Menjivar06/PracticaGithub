<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aprende Web</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="encabezado">
    <strong>Aprende Web</strong>
    <nav>
      <a href="#cursos">Cursos</a>
      <a href="#contacto">Contacto</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h1>Crea tu primera página web</h1>
      <p>Aprende HTML, CSS y diseño responsivo paso a paso.</p>
      <a class="boton" href="#cursos">Empezar</a>
    </section>

    <section id="cursos">
      <h2>Cursos</h2>
      <div class="galeria">
        <article class="tarjeta"><h3>HTML</h3><p>Estructura tu contenido.</p></article>
        <article class="tarjeta"><h3>CSS</h3><p>Dale estilo a todo.</p></article>
        <article class="tarjeta"><h3>Responsivo</h3><p>Funciona en cualquier pantalla.</p></article>
      </div>
    </section>

    <section id="contacto">
      <h2>Contacto</h2>
      <form class="formulario">
        <label for="correo">Tu correo</label>
        <input type="email" id="correo" required>
        <button class="boton" type="submit">Enviar</button>
      </form>
    </section>
  </main>

  <footer><p>© 2026 Aprende Web</p></footer>
</body>
</html>
